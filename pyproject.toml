[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "role-aware-business-agent"
version = "0.1.0"
description = "Role-aware business agent toolkit based on DeepAgents, LangChain, and LangGraph."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Business Agent Contributors" }
]
dependencies = [
    "deepagents",
    "langchain",
    "langchain-core",
    "langgraph",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
business_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
